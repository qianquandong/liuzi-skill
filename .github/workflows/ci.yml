name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Run unit and structure tests
        run: python -m unittest discover -s tests -v
      - name: Check local Markdown links
        run: python scripts/check_source_links.py .
      - name: Validate JSON manifests
        run: |
          python -m json.tool package.json >/dev/null
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool evals/evals.json >/dev/null

