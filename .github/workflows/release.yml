name: Release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify
        run: python -m unittest discover -s tests -v
      - name: Resolve version
        id: version
        run: echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build source archive
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git archive --format=zip --prefix="liuzi-skill-$tag/" -o "liuzi-skill-$tag.zip" HEAD
      - name: Publish tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Liuzi Skill $tag"
          git push origin "$tag"
          gh release create "$tag" "liuzi-skill-$tag.zip" \
            --verify-tag \
            --generate-notes \
            --title "Liuzi Skill $tag"

