name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify
        run: python -m unittest discover -s tests -v
      - name: Build source archive
        run: git archive --format=zip --prefix="liuzi-skill-$GITHUB_REF_NAME/" -o "liuzi-skill-$GITHUB_REF_NAME.zip" HEAD
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "liuzi-skill-$GITHUB_REF_NAME.zip" \
            --verify-tag \
            --generate-notes \
            --title "Liuzi Skill $GITHUB_REF_NAME"

